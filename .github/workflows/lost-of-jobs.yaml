name: Full CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  GO_VERSION: '1.21'

jobs:

  # ─── TIER 1: Foundational checks (no dependencies) ───────────────────────────

  validate-yaml:
    name: 🗂 Validate YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx js-yaml --version && echo "YAML syntax OK"

  validate-json:
    name: 🗂 Validate JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m json.tool package.json > /dev/null && echo "JSON OK"

  detect-secrets:
    name: 🔐 Detect Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Running secret scanning..."

  check-licenses:
    name: 📜 Check Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Checking open-source licenses..."

  # ─── TIER 2: Install & build foundations ─────────────────────────────────────

  install-node-deps:
    name: 📦 Install Node Deps
    runs-on: ubuntu-latest
    needs: [validate-yaml, validate-json]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

  install-python-deps:
    name: 🐍 Install Python Deps
    runs-on: ubuntu-latest
    needs: [validate-yaml]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt

  install-go-deps:
    name: 🐹 Install Go Deps
    runs-on: ubuntu-latest
    needs: [validate-yaml]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod download

  # ─── TIER 3: Linting & static analysis ───────────────────────────────────────

  lint-js:
    name: 🧹 Lint JavaScript
    runs-on: ubuntu-latest
    needs: [install-node-deps]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx eslint . --ext .js,.ts,.tsx

  lint-python:
    name: 🧹 Lint Python
    runs-on: ubuntu-latest
    needs: [install-python-deps]
    steps:
      - uses: actions/checkout@v4
      - run: pip install ruff && ruff check .

  lint-go:
    name: 🧹 Lint Go
    runs-on: ubuntu-latest
    needs: [install-go-deps]
    steps:
      - uses: actions/checkout@v4
      - run: go vet ./...

  typecheck:
    name: 🔍 TypeScript Check
    runs-on: ubuntu-latest
    needs: [install-node-deps]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx tsc --noEmit

  # ─── TIER 4: Testing ──────────────────────────────────────────────────────────

  unit-tests-js:
    name: 🧪 Unit Tests (JS)
    runs-on: ubuntu-latest
    needs: [lint-js, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx jest --coverage --ci

  unit-tests-python:
    name: 🧪 Unit Tests (Python)
    runs-on: ubuntu-latest
    needs: [lint-python]
    steps:
      - uses: actions/checkout@v4
      - run: pip install pytest && pytest tests/unit -v

  unit-tests-go:
    name: 🧪 Unit Tests (Go)
    runs-on: ubuntu-latest
    needs: [lint-go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test ./... -v -short

  # ─── TIER 5: Security & quality gates ────────────────────────────────────────

  security-scan:
    name: 🛡 Security Scan (SAST)
    runs-on: ubuntu-latest
    needs: [detect-secrets, unit-tests-js, unit-tests-python]
    steps:
      - uses: actions/checkout@v4
      - run: echo "Running Semgrep SAST..."

  dependency-audit:
    name: 🔍 Dependency Audit
    runs-on: ubuntu-latest
    needs: [install-node-deps, install-python-deps, check-licenses]
    steps:
      - uses: actions/checkout@v4
      - run: npm audit --audit-level=high

  # ─── TIER 6: Build ────────────────────────────────────────────────────────────

  build-frontend:
    name: 🏗 Build Frontend
    runs-on: ubuntu-latest
    needs: [unit-tests-js, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  build-backend:
    name: 🏗 Build Backend (Go)
    runs-on: ubuntu-latest
    needs: [unit-tests-go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build -o bin/server ./cmd/server

  build-docker:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend, security-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/
      - run: docker build -t myapp:${{ github.sha }} .

  # ─── TIER 7: Integration & E2E ───────────────────────────────────────────────

  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: [build-docker, dependency-audit]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - run: echo "Running integration tests against live DB..."

  e2e-tests:
    name: 🌐 E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [build-docker]
    steps:
      - uses: actions/checkout@v4
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  # ─── TIER 8: Performance & accessibility ─────────────────────────────────────

  lighthouse-audit:
    name: 🏎 Lighthouse Audit
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    steps:
      - uses: actions/checkout@v4
      - run: echo "Running Lighthouse CI..."

  # ─── TIER 9: Deploy ───────────────────────────────────────────────────────────

  deploy-staging:
    name: 🚀 Deploy → Staging
    runs-on: ubuntu-latest
    needs: [integration-tests, lighthouse-audit]
    environment: staging
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploying to staging environment..."

  deploy-production:
    name: 🚀 Deploy → Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploying to production environment..."

  # ─── TIER 10: Post-deploy ─────────────────────────────────────────────────────

  smoke-tests:
    name: 💨 Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-production]
    steps:
      - uses: actions/checkout@v4
      - run: echo "Verifying production is healthy..."

  notify-team:
    name: 📣 Notify Team
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    if: always()
    steps:
      - run: echo "Posting deployment summary to Slack..."
