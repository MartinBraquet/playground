name: Full CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  GO_VERSION: '1.21'

# Shared flakiness macro — rolls a d5; fails on 1 (20%), passes on 2-5 (80%)
# Usage in every run: step ↓
#   if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi

jobs:

  # ─── TIER 1: Foundational checks (no dependencies) ───────────────────────────

  validate-yaml:
    name: 🗂 Validate YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check YAML syntax
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ YAML syntax OK"

  validate-json:
    name: 🗂 Validate JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JSON syntax
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ JSON syntax OK"

  detect-secrets:
    name: 🔐 Detect Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run secret scanning
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ No secrets detected"

  check-licenses:
    name: 📜 Check Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify open-source licenses
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ All licenses compliant"

  # ─── TIER 2: Install & build foundations ─────────────────────────────────────

  install-node-deps:
    name: 📦 Install Node Deps
    runs-on: ubuntu-latest
    needs: [validate-yaml, validate-json]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install npm packages
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ npm packages installed"
      - uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

  install-python-deps:
    name: 🐍 Install Python Deps
    runs-on: ubuntu-latest
    needs: [validate-yaml]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip packages
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ Python packages installed"

  install-go-deps:
    name: 🐹 Install Go Deps
    runs-on: ubuntu-latest
    needs: [validate-yaml]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Download Go modules
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ Go modules downloaded"

  # ─── TIER 3: Linting & static analysis ───────────────────────────────────────

  lint-js:
    name: 🧹 Lint JavaScript
    runs-on: ubuntu-latest
    needs: [install-node-deps]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Run ESLint
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ No ESLint violations found"

  lint-python:
    name: 🧹 Lint Python
    runs-on: ubuntu-latest
    needs: [install-python-deps]
    steps:
      - uses: actions/checkout@v4
      - name: Run Ruff linter
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ Python lint passed"

  lint-go:
    name: 🧹 Lint Go
    runs-on: ubuntu-latest
    needs: [install-go-deps]
    steps:
      - uses: actions/checkout@v4
      - name: Run go vet
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ Go vet passed"

  typecheck:
    name: 🔍 TypeScript Check
    runs-on: ubuntu-latest
    needs: [install-node-deps]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Run tsc --noEmit
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ TypeScript types OK"

  # ─── TIER 4: Testing ──────────────────────────────────────────────────────────

  unit-tests-js:
    name: 🧪 Unit Tests (JS)
    runs-on: ubuntu-latest
    needs: [lint-js, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Run Jest
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ All JS unit tests passed"

  unit-tests-python:
    name: 🧪 Unit Tests (Python)
    runs-on: ubuntu-latest
    needs: [lint-python]
    steps:
      - uses: actions/checkout@v4
      - name: Run pytest
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ All Python unit tests passed"

  unit-tests-go:
    name: 🧪 Unit Tests (Go)
    runs-on: ubuntu-latest
    needs: [lint-go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run go test
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ All Go unit tests passed"

  # ─── TIER 5: Security & quality gates ────────────────────────────────────────

  security-scan:
    name: 🛡 Security Scan (SAST)
    runs-on: ubuntu-latest
    needs: [detect-secrets, unit-tests-js, unit-tests-python]
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep SAST
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ No security issues found"

  dependency-audit:
    name: 🔍 Dependency Audit
    runs-on: ubuntu-latest
    needs: [install-node-deps, install-python-deps, check-licenses]
    steps:
      - uses: actions/checkout@v4
      - name: Run npm audit
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ No high-severity vulnerabilities"

  # ─── TIER 6: Build ────────────────────────────────────────────────────────────

  build-frontend:
    name: 🏗 Build Frontend
    runs-on: ubuntu-latest
    needs: [unit-tests-js, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Compile frontend bundle
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          mkdir -p dist && echo "built" > dist/index.html
          echo "✅ Frontend bundle compiled"
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  build-backend:
    name: 🏗 Build Backend (Go)
    runs-on: ubuntu-latest
    needs: [unit-tests-go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Compile Go binary
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ Go binary compiled successfully"

  build-docker:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend, security-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/
      - name: Build and tag Docker image
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ Docker image built: myapp:${{ github.sha }}"

  # ─── TIER 7: Integration & E2E ───────────────────────────────────────────────

  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: [build-docker, dependency-audit]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - name: Run integration test suite
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ Integration tests passed"

  e2e-tests:
    name: 🌐 E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [build-docker]
    steps:
      - uses: actions/checkout@v4
      - name: Run Playwright E2E suite
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ All E2E scenarios passed"

  # ─── TIER 8: Performance & accessibility ─────────────────────────────────────

  lighthouse-audit:
    name: 🏎 Lighthouse Audit
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Run Lighthouse CI
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ Lighthouse scores above threshold"

  # ─── TIER 9: Deploy ───────────────────────────────────────────────────────────

  deploy-staging:
    name: 🚀 Deploy → Staging
    runs-on: ubuntu-latest
    needs: [integration-tests, lighthouse-audit]
    environment: staging
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - name: Push to staging environment
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ Deployed to staging successfully"

  deploy-production:
    name: 🚀 Deploy → Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Push to production environment
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ Deployed to production successfully"

  # ─── TIER 10: Post-deploy ─────────────────────────────────────────────────────

  smoke-tests:
    name: 💨 Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-production]
    steps:
      - uses: actions/checkout@v4
      - name: Verify production health
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ Production is healthy"

  notify-team:
    name: 📣 Notify Team
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    if: always()
    steps:
      - name: Post deployment summary to Slack
        run: |
          if [ $((RANDOM % 5)) -eq 0 ]; then echo "💥 Flaky failure!"; exit 1; fi
          echo "✅ Team notified"
